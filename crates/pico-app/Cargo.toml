[package]
name = "pico-evo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pico-core = { path = "../pico-core" }
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu", "tiny-skia", "wayland", "tokio", "crisp", "markdown", "advanced",
] }

unicode-width = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "sync"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[lints]
workspace = true

[dev-dependencies]
iced_tiny_skia = { version = "0.14", default-features = false, features = ["wayland"] }
iced_runtime = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
