[package]
name = "orbit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-io = "2.6"
base64 = "0.22"
filedescriptor = "0.8"
futures-util = "0.3"
im = { version = "15.1.0", features = ["serde"] }
nix = { version = "0.30", features = ["signal", "process", "fs"] }
portable-pty = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rquickjs = { version = "0.11", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ignore = "0.4"
notify = "8"
rustix = { version = "1", features = ["fs", "process"] }
memchr = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
serde_yaml_ng = "0.10"
pulldown-cmark = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
