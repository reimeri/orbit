[package]
name = "orbit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tempfile = "3"
im = "15.1"
regex = "1"
rustix = { version = "1", features = ["fs"] }
anyhow = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
orbit-core = { path = "../orbit-core" }
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu", "wayland", "tokio", "crisp", "markdown", "advanced", "image-without-codecs", "svg",
] }

image = { version = "0.25", default-features = false, features = ["png"] }
iced_wgpu = { version = "0.14", default-features = false }
iced_runtime = "0.14"
lru = { version = "0.16", default-features = false }

zbus = { version = "5.19", default-features = false, features = ["tokio"] }

url = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.12", default-features = false }
ratex-parser = { version = "=0.1.16", default-features = false }
ratex-layout = { version = "=0.1.16", default-features = false }
ratex-svg = { version = "=0.1.16", default-features = false, features = ["embed-fonts"] }
ratex-types = "=0.1.16"
spellbook = "0.4.2"
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "sync"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
winit = { version = "=0.30.13", default-features = false, features = ["wayland"] }

[lints]
workspace = true

[dev-dependencies]
inotify = { version = "0.11", default-features = false }
pollster = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
