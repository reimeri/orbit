[workspace]
members = ["crates/pico-app", "crates/pico-core"]
default-members = ["crates/pico-app"]
exclude = [".build-deps/cosmic-text", ".build-deps/winit", ".build-deps/iced-widget", ".build-deps/iced-winit", ".build-deps/iced-graphics", ".build-deps/rquickjs-sys", ".build-deps/rquickjs-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Keep useful backtraces without full variable debug info for the entire GUI stack.
debug = "line-tables-only"

[patch.crates-io]
# Prepared by nix develop and the package build; see patches/*/README.md.
winit = { path = ".build-deps/winit" }
iced_widget = { path = ".build-deps/iced-widget" }
iced_winit = { path = ".build-deps/iced-winit" }
iced_graphics = { path = ".build-deps/iced-graphics" }
rquickjs-sys = { path = ".build-deps/rquickjs-sys" }
rquickjs-core = { path = ".build-deps/rquickjs-core" }
cosmic-text = { path = ".build-deps/cosmic-text" }
