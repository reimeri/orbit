[workspace]
members = ["crates/pico-app", "crates/pico-core"]
default-members = ["crates/pico-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Keep useful backtraces without full variable debug info for the entire GUI stack.
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true
